<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skony · review the evidence</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17263c;font:15px/1.5 system-ui,sans-serif}header{background:#15273d;color:white;padding:22px 30px}h1{margin:0;font-size:25px}p{margin:8px 0}button,input,select,textarea{font:inherit}button{background:#155c50;color:white;border:0;border-radius:6px;padding:9px 13px;cursor:pointer}button.secondary{background:#e7edf4;color:#17263c}input,select,textarea{padding:8px;border:1px solid #bdc8d5;border-radius:5px;background:white;max-width:100%}textarea{width:100%;min-height:64px}label{display:block;font-size:13px;font-weight:650;margin:9px 0}label input,label select{display:block;width:100%}.bar{padding:12px 24px;background:white;display:flex;gap:15px;flex-wrap:wrap;align-items:center}.bar label{margin:0}.bar input[type=checkbox]{display:inline;width:auto}.layout{display:grid;grid-template-columns:240px 1fr;gap:18px;padding:20px}nav button{display:block;text-align:left;width:100%;margin-bottom:7px;background:white;color:#17263c;border:1px solid #dce3eb}nav button.active{border:2px solid #155c50}main{min-width:0}.card{background:white;border:1px solid #dce3eb;border-radius:9px;padding:19px;margin-bottom:16px}.muted{color:#53657b;font-size:13px}.warning{background:#fff5dc;border-left:4px solid #d99e23;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sources{max-height:490px;overflow:auto;border:1px solid #cbd4df;padding:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,monospace;color:#24334a}summary{cursor:pointer;font-weight:650}a{color:#146653}header a{color:#b8e6dc}.pill{display:inline-block;padding:2px 8px;background:#e7edf4;border-radius:12px;font-size:12px}.status{position:fixed;bottom:15px;right:20px;padding:10px 16px;background:#15273d;color:white;border-radius:7px;display:none}#progress{font-weight:700}h2{font-size:21px;margin-top:0}h3{font-size:16px}.field{border-top:1px solid #e1e6ed;padding-top:14px;margin-top:16px}.field .buttons{display:flex;gap:8px;margin-top:8px}.suggestion{background:#eaf3f0;padding:10px;border-radius:5px;white-space:pre-wrap}.tab-buttons{display:flex;gap:8px;margin-bottom:15px}.danger{color:#b23f2e}iframe{width:100%;height:650px;border:1px solid #ccd5df}@media(max-width:850px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;gap:8px}nav button{min-width:160px}.grid{grid-template-columns:1fr}}
</style>
<header><h1>Review the evidence</h1><p>12 real PDFs · German / French · municipal / cantonal</p><p class="muted" style="color:#bfd0e0">Work stays in this browser. Export a backup when finished or before switching browsers.</p></header>
<div class="bar"><label>Your name / reviewer ID<input id="reviewer" placeholder="Required before saving reviews"></label><label>Languages you can review<br><input type="checkbox" id="de"> German <input type="checkbox" id="fr"> French</label><label>Relevant language / parliamentary knowledge<input id="competence" placeholder="Briefly describe your competence"></label><button id="export">Export review.json</button><button class="secondary" id="import">Restore saved review</button><input type="file" id="import-file" accept=".json" hidden><span id="progress"></span></div>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div><div id="toast" class="status"></div>
<script src="pack.js"></script><script>
'use strict';
const pack=window.REVIEW_PACK, key='skony-review-'+pack.digest;
const empty=()=>({schema_version:'skony.fast-review.v1',pack_digest:pack.digest,reviewer:{id:'',languages:[],competence_note:''},documents:{},schema_reviews:{}});
let state=empty(),current=0,tab='documents';
try{const saved=JSON.parse(localStorage.getItem(key));if(saved?.pack_digest===pack.digest)state=saved}catch(e){}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){$('toast').textContent=message;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4500)}
function persist(){state.updated_at=new Date().toISOString();try{localStorage.setItem(key,JSON.stringify(state))}catch(e){notify('Browser storage unavailable. Export your review now.')}progress()}
function docState(d){return state.documents[d.id]??=( {intake:{status:'unreviewed'},fields:{}})}
function reviewer(){return state.reviewer.id.trim()&&state.reviewer.competence_note.trim()&&state.reviewer.languages.length}
function qualified(d){if(!reviewer()){notify('Enter your reviewer ID, language competence and knowledge first.');return false}const lang=docState(d).intake.language||d.hints.language;if(!state.reviewer.languages.includes(lang)){notify('This document needs a reviewer competent in '+lang.toUpperCase()+'. Leave it for that reviewer.');return false}return true}
function syncReviewer(){state.reviewer={id:$('reviewer').value.trim(),languages:['de','fr'].filter(l=>$(l).checked),competence_note:$('competence').value.trim()};persist()}
function header(){ $('reviewer').value=state.reviewer.id;$('competence').value=state.reviewer.competence_note;['de','fr'].forEach(l=>$(l).checked=state.reviewer.languages.includes(l)) }
['reviewer','competence','de','fr'].forEach(id=>$(id).addEventListener('change',syncReviewer));
function progress(){const docs=Object.values(state.documents);$('progress').textContent=docs.filter(d=>d.intake.status==='confirmed').length+'/12 intake · '+docs.reduce((n,d)=>n+Object.keys(d.fields).length,0)+' field reviews'}
function options(values,value){return values.map(v=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(v.replaceAll('_',' '))+'</option>').join('')}
function renderNav(){ $('nav').innerHTML=pack.documents.map((d,i)=>'<button data-index="'+i+'" class="'+(tab==='documents'&&current===i?'active':'')+'">'+(i+1)+'. '+esc(d.body_label)+' <span class="pill">'+d.hints.language.toUpperCase()+'</span><br><small>'+esc(d.filename)+(docState(d).intake.status==='confirmed'?' · ✓':'')+'</small></button>').join('')+'<button id="schema-nav" class="'+(tab==='schema'?'active':'')+'">Schema findings & comparative question</button>';document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.index);tab='documents';render()});$('schema-nav').onclick=()=>{tab='schema';render()}}
function render(){renderNav();progress();if(tab==='schema'){renderSchema();return}const d=pack.documents[current],s=docState(d),i=s.intake,h=d.hints;const pages=d.text.pages.map(p=>p.page);$('main').innerHTML=
 '<div class="card"><span class="pill">'+(current+1)+' / 12</span><h2>'+esc(d.display_name)+'</h2><p>'+esc(d.body_label)+' · '+h.language.toUpperCase()+' / '+h.level+' <strong>(unverified hints)</strong></p><p class="warning">'+esc(d.review_note)+'</p><p><a href="'+esc(d.pdf)+'" target="_blank" rel="noopener">Open pinned original PDF ↗</a> · <a href="'+esc(d.source_url)+'" target="_blank" rel="noopener">Official source ↗</a></p><p class="muted">PDF SHA-256: '+d.id+'</p><details><summary>View original PDF here</summary><iframe title="Pinned PDF" src="'+esc(d.pdf)+'"></iframe></details></div>'+
 '<div class="card"><h3>1 · Confirm source identity and intake</h3><p class="muted">Inspect the PDF, verify the linked affair in the official source if needed, then confirm or correct these hints. Unknown roles remain unknown.</p><div class="grid"><label>Body ID<input id="body" value="'+esc(i.body_id||d.unit.body_id)+'"></label><label>Affair ID<input id="affair" value="'+esc(i.affair_id||d.unit.affair_id)+'"></label><label>Source language<select id="language">'+options(['de','fr','unknown'],i.language||h.language)+'</select></label><label>Government level<select id="level">'+options(['municipal','cantonal','federal','unknown'],i.level||h.level)+'</select></label><label>Role in this exact PDF<select id="role">'+options(['submission','executive_response','decision_record','minutes','annex','combined','unknown'],i.role||h.role)+'</select></label><label>Pages you actually checked (comma separated)<input id="pages" value="'+esc((i.checked_pages||[]).join(','))+'" placeholder="e.g. 1,2"></label></div><label>Basis for identity, language and role<textarea id="intake-note">'+esc(i.note||'')+'</textarea></label><button id="confirm-intake">'+(i.status==='confirmed'?'Save updated intake':'Confirm checked intake')+'</button> <span class="muted">'+esc(i.status)+'</span></div>'+
 '<div class="card"><h3>2 · Read the frozen source text</h3><p class="muted">Every PDF page is included below. Extracted text can contain OCR or layout noise; check the PDF for uncertain passages and visual content.</p><div class="sources">'+d.text.pages.map(p=>'<h4>Page '+p.page+'</h4><pre data-page="'+p.page+'">'+esc(p.text)+'</pre>').join('')+'</div></div>'+
 '<div class="card"><h3>3 · Record source values</h3><p>Start with <strong>title and raw affair type</strong> on submissions. Leave anything you cannot check unreviewed.</p><p class="muted">For a source-first review, enter exact quotations yourself before revealing suggestions. Revealing suggestions records exposure and makes subsequent annotations assisted.</p><button class="secondary" id="reveal">'+(s.exposure_at?'Suggestions revealed · assisted mode':'Reveal prepared suggestions (optional)')+'</button><div id="fields"></div></div>'+
 '<div class="card"><button id="next">'+(current<11?'Next document →':'Go to schema findings →')+'</button></div>';
 $('confirm-intake').onclick=()=>{syncReviewer();if(!qualified(d))return;const checked=$('pages').value.split(',').map(x=>Number(x.trim())).filter(Number.isInteger);if(!checked.length||checked.some(p=>!pages.includes(p))||new Set(checked).size!==checked.length){notify('Enter the actual checked page numbers, without duplicates.');return}if(!$('intake-note').value.trim()||!$('body').value.trim()||!$('affair').value.trim()){notify('Complete identity IDs and the basis note.');return}if(!state.reviewer.languages.includes($('language').value)){notify('The confirmed language must match your declared competence.');return}s.intake={status:'confirmed',body_id:$('body').value.trim(),affair_id:$('affair').value.trim(),language:$('language').value,level:$('level').value,role:$('role').value,checked_pages:checked.sort((a,b)=>a-b),note:$('intake-note').value.trim(),confirmed_at:new Date().toISOString(),reviewer_id:state.reviewer.id};persist();render();notify('Intake saved.');};
 $('reveal').onclick=()=>{if(!s.exposure_at){s.exposure_at=new Date().toISOString();persist()}renderFields(d)};
 $('next').onclick=()=>{if(current<11)current++;else tab='schema';render();window.scrollTo(0,0)};renderFields(d)}
function renderFields(d){const s=docState(d);$('fields').innerHTML=pack.fields.map((f,n)=>{const r=s.fields[f]||{},p=d.suggestions[f];return '<div class="field"><h3>'+esc(f.replaceAll('_',' '))+' <span class="pill">'+esc(r.mode||'unreviewed')+'</span></h3>'+(s.exposure_at&&p?'<p class="suggestion">Prepared suggestion · page '+p.evidence.page+'\n'+esc(p.value)+'</p><button class="secondary" data-use="'+n+'">Use this quotation</button>':'')+'<label>Source assessment<select id="assessment-'+n+'">'+options(['unreviewed','present','absent_in_reviewed_scope','unknown','not_applicable'],r.assessment||'unreviewed')+'</select></label><label>Value<textarea id="value-'+n+'">'+esc(r.value||'')+'</textarea></label><div class="grid"><label>Evidence page<input type="number" min="1" id="page-'+n+'" value="'+esc(r.evidence?.page||'')+'"></label><label>Note (required for absence / uncertainty)<input id="note-'+n+'" value="'+esc(r.note||'')+'"></label></div><label>Exact source quotation<textarea id="quote-'+n+'">'+esc(r.evidence?.quote||'')+'</textarea></label><div class="buttons"><button data-save="'+n+'">Save this field</button></div></div>'}).join('');document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.use),p=d.suggestions[pack.fields[n]];$('assessment-'+n).value='present';$('value-'+n).value=p.value;$('quote-'+n).value=p.evidence.quote;$('page-'+n).value=p.evidence.page;notify('Quotation filled. Check it, then save this field.')});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveField(d,Number(b.dataset.save)))}
function saveField(d,n){syncReviewer();if(!qualified(d))return;const s=docState(d),assessment=$('assessment-'+n).value,value=$('value-'+n).value.trim(),quote=$('quote-'+n).value,page=Number($('page-'+n).value),note=$('note-'+n).value.trim();if(assessment==='unreviewed'){delete s.fields[pack.fields[n]];persist();renderFields(d);return}let evidence=null;if(assessment==='present'){const p=d.text.pages.find(p=>p.page===page),start=p?.text.indexOf(quote);if(!value||!quote||!p||start<0){notify('Present values need a value and an exact quotation from the selected source page.');return}evidence={artifact_id:d.id,text_snapshot_id:d.text_snapshot_id,page,layer_id:p.layer_id,start,end:start+quote.length,quote};}else if(value||quote){notify('Clear value and quotation for non-present assessments.');return}if(assessment!=='present'&&!note){notify('Add a note explaining this assessment.');return}if(assessment==='absent_in_reviewed_scope'&&(s.intake.status!=='confirmed'||d.text.pages.some(p=>!s.intake.checked_pages.includes(p.page)))){notify('To claim absence across this document, confirm that you checked every PDF page. Otherwise use unknown.');return}const old=s.fields[pack.fields[n]],record={assessment,value:assessment==='present'?value:null,evidence,note,reviewer_id:state.reviewer.id,updated_at:new Date().toISOString(),mode:s.exposure_at?'assisted':'source_only'};if(old?.mode==='source_only'&&s.exposure_at)record.original_source_only=old;else if(old?.original_source_only)record.original_source_only=old.original_source_only;s.fields[pack.fields[n]]=record;persist();renderFields(d);notify('Field saved.');}
function renderSchema(){$('main').innerHTML='<div class="card"><h2>Schema findings</h2><p>These are AI-prepared draft statements. Accept only after checking the linked sources; your note must explain what you verified. These are assisted judgments.</p></div>'+pack.schema_tasks.map((t,n)=>{const r=state.schema_reviews[t.id]||{};return '<div class="card"><h3>'+esc(t.id)+'</h3><p>'+esc(t.statement)+'</p><p>Sources: '+t.document_indices.map(i=>{const d=pack.documents.find(d=>d.manifest_index===i);return '<a href="'+esc(d.pdf)+'" target="_blank" rel="noopener">'+esc(d.filename)+'</a>'}).join(' · ')+'</p><label>Judgment<select id="schema-status-'+n+'">'+options(['unreviewed','accepted','corrected','unclear'],r.status||'unreviewed')+'</select></label><label>Your finding / rationale<textarea id="schema-note-'+n+'">'+esc(r.note||'')+'</textarea></label><button data-schema-save="'+n+'">Save judgment</button></div>'}).join('')+'<div class="card"><h2>Comparative question</h2><p>'+esc(pack.question)+'</p><p>The finalizer will list only confirmed Nidau/Genève submission records with reviewed raw types. It will preserve the printed names and citations, and will not imply legal equivalence or an answer elsewhere in the affair.</p><button id="finish-export">Export review.json</button></div>';document.querySelectorAll('[data-schema-save]').forEach(b=>b.onclick=()=>{syncReviewer();if(!reviewer()){notify('Enter reviewer details first.');return}const n=Number(b.dataset.schemaSave),t=pack.schema_tasks[n],status=$('schema-status-'+n).value,note=$('schema-note-'+n).value.trim();if(status==='unreviewed'){delete state.schema_reviews[t.id];persist();return}if(!note){notify('Add your source-based finding or rationale.');return}const docs=t.document_indices.map(i=>pack.documents.find(d=>d.manifest_index===i));if(docs.some(d=>docState(d).intake.status!=='confirmed')){notify('Confirm intake for every cited source before saving this judgment.');return}if(docs.some(d=>!state.reviewer.languages.includes(docState(d).intake.language))){notify('This finding requires competence in every cited source language.');return}state.schema_reviews[t.id]={status,note,reviewer_id:state.reviewer.id,updated_at:new Date().toISOString(),mode:'assisted',document_ids:docs.map(d=>d.id)};persist();notify('Schema judgment saved.')});$('finish-export').onclick=exportReview}
function exportReview(){syncReviewer();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Review exported. Keep this JSON file.')}
function validateRestore(x){if(x.schema_version!=='skony.fast-review.v1'||x.pack_digest!==pack.digest||!x.reviewer||!Array.isArray(x.reviewer.languages)||typeof x.reviewer.id!=='string'||typeof x.reviewer.competence_note!=='string'||!x.documents||!x.schema_reviews)throw Error('This is not a review export for this pack');for(const [id,d] of Object.entries(x.documents)){if(!pack.documents.some(p=>p.id===id)||!d.intake||!d.fields)throw Error('Unknown document or invalid review');}return x}
function importReview(file){file.text().then(raw=>{try{const incoming=validateRestore(JSON.parse(raw));if(Object.keys(state.documents).some(id=>state.documents[id].intake.status==='confirmed'||Object.keys(state.documents[id].fields).length)&&!confirm('Restoring replaces the review currently saved in this browser. Export it first if you need to keep it. Continue?'))return;state=incoming;persist();header();render();notify('Review restored.')}catch(e){notify('Restore rejected: '+e.message)}})}
$('export').onclick=exportReview;$('import').onclick=()=>$('import-file').click();$('import-file').onchange=e=>{if(e.target.files[0])importReview(e.target.files[0]);e.target.value=''};header();render();
</script></html>
