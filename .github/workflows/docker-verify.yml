name: Docker verify

on:
  push:
  workflow_dispatch:

jobs:
  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx for the verification script
        run: python3 -m pip install --quiet httpx

      - name: Environment canary
        run: |
          {
            echo "== os =="; uname -a
            echo "== python =="; python3 --version; which python3
            echo "== docker =="; docker version 2>&1 | head -20
            echo "== compose =="; docker compose version 2>&1
            echo "== checkout =="; ls -la
            echo "== track_2a =="; ls -la track_2a | head -25
          } > "$RUNNER_TEMP/canary.log" 2>&1
          cat "$RUNNER_TEMP/canary.log"

      - name: Verify container build, tests, preview and review persistence
        working-directory: track_2a
        run: |
          python3 scripts/check_docker.py --out "$RUNNER_TEMP/docker-check" 2>&1 | tee "$RUNNER_TEMP/docker-check-step.log"
          echo "verifier exit code: ${PIPESTATUS[0]}" | tee -a "$RUNNER_TEMP/docker-check-step.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-check-report
          path: |
            ${{ runner.temp }}/docker-check/report.json
            ${{ runner.temp }}/docker-check/docker.log
            ${{ runner.temp }}/docker-check-step.log
            ${{ runner.temp }}/canary.log
          retention-days: 30
          if-no-files-found: warn

      - name: Publish machine-readable report to the docker-check branch
        if: always()
        run: |
          mkdir -p /tmp/report
          cp "$RUNNER_TEMP/canary.log" /tmp/report/ 2>/dev/null
          cp "$RUNNER_TEMP/docker-check/report.json" /tmp/report/ 2>/dev/null
          cp "$RUNNER_TEMP/docker-check-step.log" /tmp/report/ 2>/dev/null
          ls -la /tmp/report
          cd /tmp/report
          git init -q -b docker-check .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Docker verification report (run ${{ github.run_number }})"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin docker-check
