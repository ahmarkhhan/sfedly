name: Docker verify

on:
  push:
  workflow_dispatch:

jobs:
  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify container build, tests, preview and review persistence
        working-directory: track_2a
        run: python3 scripts/check_docker.py --out "$RUNNER_TEMP/docker-check"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-check-report
          path: |
            ${{ runner.temp }}/docker-check/report.json
            ${{ runner.temp }}/docker-check/docker.log
          retention-days: 30
