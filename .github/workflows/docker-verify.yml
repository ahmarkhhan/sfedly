name: Docker verify

on:
  push:
  workflow_dispatch:

jobs:
  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Environment canary
        run: |
          {
            echo "== os =="; uname -a
            echo "== python =="; python3 --version; which python3
            echo "== docker =="; docker version 2>&1 | head -20
            echo "== compose =="; docker compose version 2>&1
            echo "== checkout =="; ls -la
            echo "== track_2a =="; ls -la track_2a | head -25
          } > "$RUNNER_TEMP/canary.log" 2>&1
          cat "$RUNNER_TEMP/canary.log"

      - name: Verify container build, tests, preview and review persistence
        working-directory: track_2a
        run: |
          python3 scripts/check_docker.py --out "$RUNNER_TEMP/docker-check" > "$RUNNER_TEMP/docker-check-step.log" 2>&1
          rc=$?
          echo "verifier exit code: $rc" | tee -a "$RUNNER_TEMP/docker-check-step.log"
          exit $rc

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-check-report
          path: |
            ${{ runner.temp }}/docker-check/report.json
            ${{ runner.temp }}/docker-check/docker.log
            ${{ runner.temp }}/docker-check-step.log
            ${{ runner.temp }}/canary.log
          retention-days: 30
          if-no-files-found: warn

      - name: Publish machine-readable report to the docker-check branch
        if: always()
        continue-on-error: true
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan docker-check 2>/dev/null || git checkout -B docker-check
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p docker-check
          [ -f "$RUNNER_TEMP/canary.log" ] && cp "$RUNNER_TEMP/canary.log" docker-check/canary.log
          [ -f "$RUNNER_TEMP/docker-check/report.json" ] && cp "$RUNNER_TEMP/docker-check/report.json" docker-check/report.json
          [ -f "$RUNNER_TEMP/docker-check-step.log" ] && cp "$RUNNER_TEMP/docker-check-step.log" docker-check/step-output.log
          [ -f "$RUNNER_TEMP/docker-check/docker.log" ] && tail -c 262144 "$RUNNER_TEMP/docker-check/docker.log" > docker-check/docker.log.tail.txt
          ls -la docker-check
          git add docker-check
          git commit -m "Docker verification report (run ${{ github.run_number }}, conclusion: ${{ job.status }})"
          git push -f origin docker-check
