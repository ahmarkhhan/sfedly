name: Docker verify

on:
  push:
  workflow_dispatch:

jobs:
  docker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Environment canary
        run: |
          {
            echo "== os =="; uname -a
            echo "== python =="; python3 --version; which python3
            echo "== docker =="; docker version 2>&1 | head -20
            echo "== compose =="; docker compose version 2>&1
            echo "== checkout =="; ls -la
            echo "== track_2a =="; ls -la track_2a | head -25
          } > "$RUNNER_TEMP/canary.log" 2>&1
          cat "$RUNNER_TEMP/canary.log"

      - name: Verify container build, tests, preview and review persistence
        working-directory: track_2a
        run: |
          set -o pipefail
          python3 scripts/check_docker.py --out "$RUNNER_TEMP/docker-check" 2>&1 | tee "$RUNNER_TEMP/docker-check-step.log"

      - name: Publish machine-readable report to the docker-check branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin docker-check || true
          git checkout -B docker-check origin/docker-check 2>/dev/null || git checkout --orphan docker-check
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p docker-check
          if [ -f "$RUNNER_TEMP/canary.log" ]; then cp "$RUNNER_TEMP/canary.log" docker-check/canary.log; fi
          cp "$RUNNER_TEMP/docker-check/report.json" docker-check/report.json || echo "report.json missing; verifier crashed before writing it" > docker-check/report-missing.txt
          if [ -f "$RUNNER_TEMP/docker-check/docker.log" ]; then
            tail -c 262144 "$RUNNER_TEMP/docker-check/docker.log" > docker-check/docker.log.tail.txt || true
          fi
          if [ -f "$RUNNER_TEMP/docker-check-step.log" ]; then
            cp "$RUNNER_TEMP/docker-check-step.log" docker-check/step-output.log || true
          fi
          docker version > docker-check/docker-version.txt 2>&1 || true
          docker compose version >> docker-check/docker-version.txt 2>&1 || true
          git add docker-check
          git commit -m "Docker verification report (run ${{ github.run_number }}, conclusion: ${{ job.status }})" || true
          git push -f origin docker-check

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-check-report
          path: |
            ${{ runner.temp }}/docker-check/report.json
            ${{ runner.temp }}/docker-check/docker.log
          retention-days: 30
